version: 1

roles:
  goal: references/goal-agent.md
  peer: references/peer-agent.md

agents:
  goal:
    candidates:
      - name: primary
        kind: pi
        model: kimi-coding/k3
        args: []
      - name: fallback
        kind: pi
        model: zai-coding-cn/glm-5.3
        args: []
  peer:
    candidates:
      - name: primary
        kind: pi
        model: zai-coding-cn/glm-5.3
        args: []
      - name: fallback
        kind: pi
        model: openai-codex/gpt-5.6-luna
        args:
          - --thinking
          - max

limits:
  max_goal_attempts: 2
  max_review_rounds: 3

fallback:
  strategy: ordered
  recovery_prompts: 1
  prefer_untried_goal_candidate: true
  try_each_peer_candidate_once_per_assignment: true
  switch_on:
    - startup_failure
    - prompt_delivery_failure
    - process_exit
    - provider_or_model_error
    - wait_failure_without_observed_progress
    - missing_terminal_marker_after_recovery
  quarantine_for_run_on:
    - unsupported_model
    - authentication_failure
    - quota_failure
    - provider_unavailable
  do_not_switch_on:
    - approval_or_user_input_blocked
    - semantic_terminal_marker
    - implementation_or_test_failure
    - outer_review_reject
    - context_expansion_request
